      compliance:
        - 洗錢防制規範
      non_functional_goals:
        availability: "99.95%"
    user_prompt: |
      開發資產投資組合追蹤系統，自動抓取資產市價、計算部位估值、產生風險報告，支援多投資人帳戶分離。
