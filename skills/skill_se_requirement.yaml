apiVersion: harness.io/v1
kind: aiSkill
metadata:
  name: 需求理解
  identifier: skill_se_requirement
  description: 需求理解
  tags:
    - software-engineering
    - se-workflow
spec:
  version: 0.2.0
  skillDefinition:
    meta:
      id: skill_se_requirement
      name: 需求理解
      description: 需求理解 VERSION MARKER XYZ123
      version: 0.2.0
      depends_on: []
      output_artifact_type: requirement_spec
    input_schema:
      type: object
      properties:
        project_context:
          type: object
        user_input:
          type: string
        previous_artifacts:
          type: array
      required: [project_context, user_input]
    core_prompt: |
      【Skill ID: skill_se_requirement｜職責:需求理解｜主Skill】
      任務目標:理解並分析用戶需求，明確功能與非功能需求，利用需求工程技術 elicitate、分析、規格化與驗證需求；輸出需求規範供後續Stage使用。
      輸入參考:ProjectContext、User Input
      執行步驟:
      1. 需求 elicitation：訪談利益相關者、問卷調查、工作坊以收集原始需求。
      2. 需求分析與澄清：對收集到的需求進行分類、優先級排序（MoSCoW）、衝突檢測與澄清 ambiguities。
      3. 功能需求規格化：使用用戶故事(User Story)、使用案例或功能分解來規格化功能需求。
      4. 非功能需求制定：定效能、安全、相容性、可用性等非功能需求的可測指標。
      5. 需求追溯矩陣：建立需求與原始請求、後續設計的雙向追溯鏈結。
      6. 需求驗證：走檢、原型評估或模擬以驗證需求正確性與完整性。
      ## 強制輸出規則
      1. 僅回傳單一純JSON
      2. 嚴格遵守Artifact結構
      ## 輸出Artifact結構
      {
        "business_goal": string,
        "functional_requirements": [{"id":string,"description":string,"priority":"Must|Should|Could|Won't"}],
        "non_functional_requirements": [{"category":string,"requirement":string,"metric":string,"target_value":string}],
        "user_stories": [{"id":string,"title":string,"description":string,"acceptance_criteria":[string]}],
        "quality_score": number
      }
      ## 驗收自檢守則:
      - 必須包含 business_goal、functional_requirements、non_functional_requirements、user_stories
      - quality_score 為 0~100 數字；quality_score >= 70 可通過 Stage Gate
    acceptance_criteria:
      - business_goal 與 User Input 相關聯
      - functional_requirements 包含 id、description、priority 欄位
      - non_functional_requirements 包含 category、requirement、metric、target_value 欄位
      - user_stories 包含 id、title、description、acceptance_criteria 欄位
      - quality_score 為 0~100 數字；quality_score >= 70 可通過 Stage Gate
    output_schema:
      type: object
      required:
        - artifact
        - quality_score
      properties:
        artifact:
          type: object
          properties:
            business_goal:
              type: string
            functional_requirements:
              type: array
              items:
                type: object
                required: [id, description, priority]
                properties:
                  id:
                    type: string
                  description:
                    type: string
                  priority:
                    type: string
                    enum: ["Must", "Should", "Could", "Won't"]
            non_functional_requirements:
              type: array
              items:
                type: object
                required: [category, requirement, metric, target_value]
                properties:
                  category:
                    type: string
                  requirement:
                    type: string
                  metric:
                    type: string
                  target_value:
                    type: string
            user_stories:
              type: array
              items:
                type: object
                required: [id, title, description, acceptance_criteria]
                properties:
                  id:
                    type: string
                  title:
                    type: string
                  description:
                    type: string
                  acceptance_criteria:
                    type: array
                    items:
                      type: string
            quality_score:
              type: number
              minimum: 0
              maximum: 100
              description: 需求理解完整度分數
    error_handler:
      retry_strategy: 1
      max_retry_count: 3
      fallback_action: mark_human_review
      retry_prompt: "你的輸出JSON不符合schema，請重新產出嚴格符合schema的純JSON，不要任何額外文字、Markdown與註解"