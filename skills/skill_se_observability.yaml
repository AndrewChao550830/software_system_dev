apiVersion: harness.io/v1
kind: aiSkill
metadata:
  name: skill_se_observability
  identifier: skill_se_observability
  description: 可觀測性設計｜監控指標設計、日誌管理策略、異常檢測與追蹤、可視化儀表板
  tags:
    - software-engineering
    - se-workflow
spec:
  version: 0.2.0
  skillDefinition:
    meta:
      id: skill_se_observability
      name: 可觀測性設計
      description: 基於程式實作與架構設計Artifact，制定監控指標策略、設計日誌管理方案、規劃異常檢測機制與分散式追蹤，提供可視化儀表板方案；輸出可觀測性供後續Stage與Gate閘門判斷
      version: 0.2.0
      depends_on: [skill_se_tech_design, skill_se_deployment]
      output_artifact_type: observability_design
    input_schema:
      type: object
      properties:
        project_context:
          type: object
        user_input:
          type: string
        previous_artifacts:
          type: array
      required: [project_context, previous_artifacts]
    core_prompt: |
      【Skill ID: skill_se_observability｜職責:可觀測性設計｜主Skill】
      任務目標:基於程式實作與架構設計Artifact，制定監控指標策略、設計日誌管理方案、規劃異常檢測機制與分散式追蹤，提供可視化儀表板方案；輸出完整可觀測性設計結構JSON.
      輸入參考:程式實作Artifact、技術設計Artifact、ProjectContext、可觀測性需求補充.
      執行步驟:
      1. 監控指標設計：根據服務等級目標(SLO)，設計關鍵效能指標(KPI)、資源使用率指標與業務指標。
      2. 日誌管理策略：設計日誌採集、儲存、索引與保留政策，結合結構化日誌與關聯ID。
      3. 異常檢測與追蹤：設計閾值警報、異常行為偵測與分散式追蹤實作。
      4. 可視化儀表板方案：針對不同角色設計監控儀表板，包含實時視圖與歷史趨勢分析。
      5. 整合非功能需求：可觀測性安全性、資料隱私保護與警報噪音控制納入設計方案。
      6. 輸出完整risk_list，分級Critical|High|Medium|Low，每筆風險包含描述、影響、緩解方案.
      ## 強制輸出規則
      1. 僅回傳單一純JSON，禁止前言、額外解釋、markdown、```json程式碼標籤、JSON註解。
      2. 嚴格遵守下面Artifact結構，欄名不可修改，不可隨意增減頂層欄位。
      3. quality_score 評分規則（0~100數值，供Gate閘門使用）**必須遵守**：
         - 0 分：完全空白，無任何有效輸出
         - 1~39：少量內容，核心資訊大量缺失，無法進入下一階段
         - 40~69：內容存在，但關鍵資訊不足，Gate攔截人工審查
         - 70~84：核心內容完整，少量次要缺點，可放行
         - 85~100：產物完備，包含風險、邊界、例外場景考量
         - 必須在artifact中新增 `score_rationale` 欄位，說明評分理由與扣分項目.
      ## 輸出Artifact結構
      {
        "monitoring_indicators": [{"indicator":string,"target":string,"measurement":string,"frequency":string}],
        "log_management": [{"collection":string,"storage":string,"indexing":string,"retention":string}],
        "anomaly_detection": [{"detection_type":string,"trigger":string,"action":string,"scope":string}],
        "tracing_system": [{"trace_id":string,"sampling":string,"export_format":string}],
        "visualization_dashboard": [{"role":string,"view_type":string,"data_source":string,"refresh_rate":string}],
        "non_functional_observability": [{"nf_aspect":string,"control":string,"validation":string}],
        "risk_list": [{"risk_desc":string,"level":"Critical|High|Medium|Low","impact":string,"mitigation":string}],
        "quality_score": number,
        "score_rationale": string
      }
    acceptance_criteria:
      - 監控指標必須說明測量方法與採集頻率
      - 日誌管理必須定義採集點、儲存介質與索引策略
      - 異常檢測必須區分規則基礎與機器學習基礎方法
      - 儀表板設計必須說明資料來源與更新頻率
      - 可觀測性安全必須說明防護措施
      - risk_list風險等級使用 Critical|High|Medium|Low
      - 必須包含 score_rationale 欄位
      - quality_score為0~100數字；quality_score >= 70 かつ 未有Critical/High可觀測性風險無緩解方案時才可通過Stage Gate
    output_schema:
      type: object
      required:
        - artifact
        - risk_list
        - quality_score
      properties:
        artifact:
          type: object
          description: 主可觀測性設計產物結構
          properties:
            monitoring_indicators:
              type: array
              items:
                type: object
                required: [indicator, target, measurement, frequency]
                properties:
                  indicator:
                    type: string
                  target:
                    type: string
                  measurement:
                    type: string
                  frequency:
                    type: string
            log_management:
              type: array
              items:
                type: object
                required: [collection, storage, indexing, retention]
                properties:
                  collection:
                    type: string
                  storage:
                    type: string
                  indexing:
                    type: string
                  retention:
                    type: string
            anomaly_detection:
              type: array
              items:
                type: object
                required: [detection_type, trigger, action, scope]
                properties:
                  detection_type:
                    type: string
                  trigger:
                    type: string
                  action:
                    type: string
                  scope:
                    type: string
            tracing_system:
              type: array
              items:
                type: object
                required: [trace_id, sampling, export_format]
                properties:
                  trace_id:
                    type: string
                  sampling:
                    type: string
                  export_format:
                    type: string
            visualization_dashboard:
              type: array
              items:
                type: object
                required: [role, view_type, data_source, refresh_rate]
                properties:
                  role:
                    type: string
                  view_type:
                    type: string
                  data_source:
                    type: string
                  refresh_rate:
                    type: string
            non_functional_observability:
              type: array
              items:
                type: object
                required: [nf_aspect, control, validation]
                properties:
                  nf_aspect:
                    type: string
                  control:
                    type: string
                  validation:
                    type: string
            risk_list:
              type: array
              description: 直通Gateの可觀測性設計階段風險清論，與artifact内risk_list保持一致
            quality_score:
              type: number
              minimum: 0
              maximum: 100
    error_handler:
      retry_strategy: 1
      max_retry_count: 3
      fallback_action: mark_human_review
      retry_prompt: "你的輸出JSON不符合schema，請重新產出嚴格符合schema的純JSON，不要任何額外文字、Markdown與註解"