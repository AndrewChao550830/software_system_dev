apiVersion: harness.io/v1
kind: aiSkill
metadata:
  name: 程式碼實作
  identifier: skill_se_code_implementation
  description: 程式碼框架實作│骨架代碼、介面定義與基本功能
  tags:
  - software-engineering
  - se-workflow
spec:
  version: 0.2.0
  skillDefinition:
    meta:
      id: skill_se_code_implementation
      name: 程式碼實作
      description: 基於所有前置Artifact，生成骨架程式碼、定義介面契約與實作基本功能模組；輸出程式碼實作供後續Stage使用
      version: 0.2.0
      depends_on:
      - skill_se_data_state_design
      output_artifact_type: code_implementation
    input_schema:
      type: object
      properties:
        project_context:
          type: object
        user_input:
          type: string
        previous_artifacts:
          type: array
      required:
      - project_context
    core_prompt: "【Skill ID: skill_se_code_implementation｜職責:程式碼實作｜主Skill】\n任務目標:基於所有前置Artifact，生成骨架程式碼、定義介面契約與實作基本功能模組；輸出完整程式碼實作結構JSON。\n\
      輸入參考:所有前置Artifact、ProjectContext、實作技術或框架特別假設。特別注意：ProjectContext 可能包含 my_code_standard_precheck 結果，用於參考前置檢查的品質分數與合規情況。\n\
      執行步驟:\n1. 骨架程式碼生成：根據系統組件設計與介面契約，生成專案結構與骨架代碼。\n2. 介面契約實作：根據定義的資料模型與服務介面，實作API端點與資料存取層。\n3. 基本功能模組：根據用戶故事與功能需求，實作核心業務邏輯與輔助功能。\n\
      4. 資料庫遷移腳本：根據實體關係圖，生成資料庫schema與初始資料腳本。\n5. 錯誤處理與日誌：統一錯誤處理機制與應用日誌標準。\n6. 單元測試框架：設置測試框架與產生基本測試樣板。\n7. 設定與環境管理：實作環境變數處理與配置管理系統。\n\
      8. 原始碼安全自審：掃描程式碼內硬編碼密碼、認證機制缺陷等安全風險，輸出risk_list與對應acceptance_criteria。\n9. 輸出完整程式碼實作結構JSON.\n## 強制輸出規則\n1. 僅回傳單一純JSON，禁止前言、額外解釋、markdown、```json程式碼標籤、JSON註解。\n\
      2. 嚴格遵守下面Artifact結構，欄名不可修改，不可隨意增減頂層欄位。\n3. quality_score 評分規則（0~100數值，供Gate閘門使用）**必須遵守**：\n   - 0 分：完全空白，無任何有效輸出\n \
      \  - 1~39：少量內容，核心資訊大量缺失，無法進入下一階段\n   - 40~69：內容存在，但關鍵資訊不足，Gate攔截人工審查\n   - 70~84：核心內容完整，少量次要缺點，可放行\n   - 85~100：產物完備，包含風險、邊界、例外場景考量\n\
      \   - 必須在artefact 中增加 score_rationale 欄位（字串類型），用以說明 quality_score 的評分理由。內容必須包含：\n         - 前置檢查 my-code-standard 的品質分數與合規情況（如\
      \ project_context.my_code_standard_precheck 可用）。\n         - 根據 quality_score 評分規則的具體違規項目及扣分明細。\n         - 若 quality_score\
      \ 為 0，必須說明未產出任何程式碼內容的原因.\n## 輸出Artifact結構\n{\n  \"project_structure\": {\"directories\":[string],\"files\":[string]},\n\
      \  \"api_endpoints\": [{\"method\":string,\"path\":string,\"handler\":string}],\n  \"data_models\": [{\"name\":string,\"\
      fields\":[string]}],\n  \"business_logic\": [{\"module\":string,\"function\":string,\"description\":string}],\n  \"\
      database_migration\": [{\"version\":string,\"operation\":string,\"sql\":string}],\n  \"error_handling\": {\"strategy\"\
      :string,\"logging\":string},\n  \"testing_framework\": {\"framework\":string,\"test_cases\":[string]},\n  \"configuration_management\"\
      : {\"provider\":string,\"variables\":[string]},\n  \"risk_list\": [{\"vuln_id\":string,\"severity\":string,\"description\"\
      :string}],\n  \"acceptance_criteria\": [{\"criteria_id\":string,\"title\":string,\"description\":string,\"related_vuln\"\
      :[string],\"check_method\":string,\"pass_condition\":string}],\n  \"quality_score\": number,\n  \"score_rationale\"\
      : string\n}\n"
    acceptance_criteria:
    - 骨架程式碼生成必須說明遵循的專案結構與命名慣例
    - 介面契約實作必須說明實作的資料模型與服務介面類型
    - 基本功能模組必須說明對應的用戶故事與功能需求
    - 資料庫遷移腳本必須說明根據實體關係圖生成的schema與初始資料
    - 錯誤處理與日誌必須說明統一的錯誤處理機制與應用日誌標準
    - 單元測試框架必須說明設置測試框架與產生基本測試樣板
    - 設定與環境管理必須說明實作環境變數處理與配置管理系統
    - 必須包含 score_rationale 欄位
    - quality_score為0~100數字；quality_score >= 70 且 未有Critical/High程式碼實作風險無緩解方案時才可通過Stage Gate
    gate:
      gate_name: code_implementation_security_gate
      gate_type: security_audit
      description: Code Implementation Stage 安全閘門，檢查原始碼實作安全風險與驗收準則
      threshold_settings:
        quality_score_min: 70.0
      validation_rules:
      - criteria_id: AC-CODE-001
        title: 移除程式硬編碼資料庫密碼
        description: '原始碼、程式內寫死字串、靜態組態檔不可包含明文資料庫密碼與資料庫憑證； 憑證需透過環境變數或加密金鑰管理服務載入。.env檔不可提交至Git版本庫，需加入.gitignore。

          '
        related_vuln:
        - VULN-001
        check_method: SAST原始碼掃描 + git歷史secret掃描 + pre-commit hook檢查
        pass_condition: 原始碼與git提交記錄不存在明文DB密碼，憑證需透過環境變數或加密金鑰管理服務載入
      - criteria_id: AC-CODE-002
        title: 管理員介面強制啟用MFA多因素認證
        description: '管理員後台登入流程必須啟用TOTP多因素認證；管理帳號未完成MFA綁定時，禁止登入管理介面。 僅完成密碼驗證無法存取任何管理功能。

          '
        related_vuln:
        - VULN-002
        check_method: 單元測試、整合測試、端到端登入場景測試
        pass_condition: 未綁定MFA管理帳號登入會被攔截；登入流程必須通過密碼+TOTP二次驗證
      failure_handling:
        action: pause_workflow
        output_artifact_key: acceptance_criteria
        message_template: '安全審計發現阻斷型漏洞，自動產生對應驗收準則。 漏洞清單：{{risk_list}}，請依據validation_rules修正程式後重跑Stage.

          '
    error_handler:
      retry_strategy: 1
      max_retry_count: 3
      fallback_action: mark_human_review
      retry_prompt: 你的輸出JSON不符合schema，請重新產出嚴格符合schema的純JSON，不要任何額外文字、Markdown與註見
    output_schema:
      type: object
      required:
      - artifact
      - quality_score
      - unresolved_questions
      - risk_list
      properties:
        artifact:
          type: object
          additionalProperties: true
        quality_score:
          type: number
          description: 0~100 的品質分數，Gate閘門判斷依據，必須>=70
        unresolved_questions:
          type: array
          items:
            type: string
        risk_list:
          type: array
          items:
            type: object
            additionalProperties: true
