apiVersion: harness.io/v1
kind: aiSkill
metadata:
  name: 程式碼實作
  identifier: skill_se_code_implementation
  description: 程式碼框架實作│骨架代碼、介面定義與基本功能
  tags:
    - software-engineering
    - se-workflow
spec:
  version: 0.2.0
  skillDefinition:
    meta:
      id: skill_se_code_implementation
      name: 程式碼實作
      description: 基於所有前置Artifact，生成骨架程式碼、定義介面契約與實作基本功能模組；輸出程式碼實作供後續Stage使用
      version: 0.2.0
      depends_on: [skill_se_data_state_design] # This will be updated based on context in pipeline
      output_artifact_type: code_implementation
    input_schema:
      type: object
      properties:
        project_context:
          type: object
          description: Harness全域ProjectContext，包含編碼標準與開發框架指引
        user_input:
          type: string
          description: 特別關注的實作技術或框架假設
        previous_artifacts:
          type: array
          description: 所有前置Stage產物，特别是資料與狀態設計產物
      required: [project_context]
    core_prompt: |
      【Skill ID: skill_se_code_implementation｜職責:程式碼實作｜主Skill】
      任務目標:基於所有前置Artifact，生成骨架程式碼、定義介面契約與實作基本功能模組；輸出完整程式碼實作結構JSON。
      輸入參考:所有前置Artifact、ProjectContext、實作技術或框架特別假設。
      執行步驟:
      1. 骨架程式碼生成：根據系統組件設計與介面契約，生成專案結構與骨架代碼。
      2. 介面契約實作：根據定義的資料模型與服務介面，實作API端點與資料存取層。
      3. 基本功能模組：根據用戶故事與功能需求，實作核心業務邏輯與輔助功能。
      4. 資料庫遷移腳本：根據實體關係圖，生成資料庫schema與初始資料腳本。
      5. 錯誤處理與日誌：統一錯誤處理機制與應用日誌標準。
      6. 單元測試框架：設置測試框架與產生基本測試樣板。
      7. 設定與環境管理：實作環境變數處理與配置管理系統。
      8. 原始碼安全自審：掃描程式碼內硬編碼密碼、認證機制缺陷等安全風險，輸出risk_list與對應acceptance_criteria。
      9. 輸出完整程式碼實作結構JSON。

      ## 強制輸出規則
      1. 僅回傳單一純JSON，禁止前言、額外解釋、markdown、```json程式碼標籤、JSON註解。
      2. 嚴格遵守下面Artifact結構，欄名不可修改，不可隨意增減頂層欄位。
      3. quality_score 評分規則（0~100數值，供Gate閘門使用）
         - 80~100:骨架結構完整正確；介面契約有完整實作；基本功能覆蓋主要用戶故事；資料庫遷移可執行；無Critical/High風險
         - 70~79:主要骨架元素已生成；介面契約有主要實作說明；基本功能有主要模組完成；資料庫遷移有主要腳本；識別主要實作風險；少量Medium/Low風險；滿足Gate放行門檻
         - 60~69:骨架生成存在依據但缺少次要組件；介面契約存在實作但缺少詳細說明；基本功能模組存在但缺少詳細說明；存在High風險但有緩解方案；無Critical阻斷項
         - 0~59:骨架缺失或結構錯誤；介面契約缺失；基本功能缺失；資料庫遷移缺失；存在Critical/High實作風險無緩解方案；Gate會攔截進入人工審批
      4. 骨架程式碼生成必須說明遵循的專案結構與命名慣例。
      5. 介面契約實作必須說明實作的資料模型與服務介面類型。
      6. 基本功能模組必須說明對應的用戶故事與功能需求。
      7. 資料庫遷移腳本必須說明根據實體關係圖生成的schema與初始資料。
      8. 錯誤處理與日誌必須說明統一的錯誤處理機制與應用日誌標準。
      9. 安全審計規則：若偵測到阻斷型漏洞，必須自動產生對應acceptance_criteria，每一筆漏洞至少對應一條驗收項目；每一條AC必須包含 criteria_id、title、description、related_vuln、check_method、pass_condition。
      10. risk_list存放所有安全漏洞，欄位固定：vuln_id, severity, description；無漏洞回傳空陣列[]，不可刪除key。
      11. acceptance_criteria不可省略，無驗收項目時回傳空陣列[]，不可刪除key。

      ## 輸出Artifact結構
      {
        "project_structure": {"directories":[string],"files":[string]},
        "api_endpoints": [{"method":string,"path":string,"handler":string}],
        "data_models": [{"name":string,"fields":[string]}],
        "business_logic": [{"module":string,"function":string,"description":string}],
        "database_migration": [{"version":string,"operation":string,"sql":string}],
        "error_handling": {"strategy":string,"logging":string},
        "testing_framework": {"framework":string,"test_cases":[string]},
        "configuration_management": {"provider":string,"variables":[string]},
        "risk_list": [{"vuln_id":string,"severity":string,"description":string}],
        "acceptance_criteria": [{"criteria_id":string,"title":string,"description":string,"related_vuln":[string],"check_method":string,"pass_condition":string}],
        "quality_score": number
      }

      驗收自檢守則:
      - 骨架程式碼生成必須說明遵循的專案結構與命名慣例
      - 介面契約實作必須說明實作的資料模型與服務介面類型
      - 基本功能模組必須說明對應的用戶故事與功能需求
      - 資料庫遷移腳本必須說明根據實體關係圖生成的schema與初始資料
      - 錯誤處理與日誌必須說明統一的錯誤處理機制與應用日誌標準
      - 單元測試框架必須說明設置測試框架與產生基本測試樣板
      - 設定與環境管理必須說明實作環境變數處理與配置管理系統
      - quality_score為0~100數字；quality_score >= 70 且 未有Critical/High程式碼實作風險無緩解方案時才可通過Stage Gate
    output_schema:
      type: object
      required:
        - artifact
        - quality_score
      properties:
        artifact:
          type: object
          properties:
            project_structure:
              type: object
              properties:
                directories:
                  type: array
                  items:
                    type: string
                files:
                  type: array
                  items:
                    type: string
            api_endpoints:
              type: array
              items:
                type: object
                required: [method, path, handler]
                properties:
                  method:
                    type: string
                  path:
                    type: string
                  handler:
                    type: string
            data_models:
              type: array
              items:
                type: object
                required: [name, fields]
                properties:
                  name:
                    type: string
                  fields:
                    type: array
                    items:
                      type: string
            business_logic:
              type: array
              items:
                type: object
                required: [module, function, description]
                properties:
                  module:
                    type: string
                  function:
                    type: string
                  description:
                    type: string
            database_migration:
              type: array
              items:
                type: object
                required: [version, operation, sql]
                properties:
                  version:
                    type: string
                  operation:
                    type: string
                  sql:
                    type: string
            error_handling:
              type: object
              properties:
                strategy:
                  type: string
                logging:
                  type: string
            testing_framework:
              type: object
              properties:
                framework:
                  type: string
                test_cases:
                  type: array
                  items:
                    type: string
            configuration_management:
              type: object
              properties:
                provider:
                  type: string
                variables:
                  type: array
                  items:
                    type: string
            risk_list:
              type: array
              items:
                type: object
                required: [vuln_id, severity, description]
                properties:
                  vuln_id:
                    type: string
                  severity:
                    type: string
                  description:
                    type: string
            acceptance_criteria:
              type: array
              items:
                type: object
                required:
                  [
                    criteria_id,
                    title,
                    description,
                    related_vuln,
                    check_method,
                    pass_condition,
                  ]
                properties:
                  criteria_id:
                    type: string
                  title:
                    type: string
                  description:
                    type: string
                  related_vuln:
                    type: array
                    items:
                      type: string
                  check_method:
                    type: string
                  pass_condition:
                    type: string
          required:
            - project_structure
            - api_endpoints
            - data_models
            - business_logic
            - database_migration
            - error_handling
            - testing_framework
            - configuration_management
            - risk_list
            - acceptance_criteria
        quality_score:
          type: number
          minimum: 0
          maximum: 100
          description: 程式碼實作完整度分數，Gate閘門判斷依據
    acceptance_criteria:
      - 骨架程式碼生成必須說明遵循的專案結構與命名慣例
      - 介面契約實作必須說明實作的資料模型與服務介面類型
      - 基本功能模組必須說明對應的用戶故事與功能需求
      - 資料庫遷移腳本必須說明根據實體關係圖生成的schema與初始資料
      - 錯誤處理與日誌必須說明統一的錯誤處理機制與應用日誌標準
      - 單元測試框架必須說明設置測試框架與產生基本測試樣板
      - 設定與環境管理必須說明實作環境變數處理與配置管理系統
      - quality_score為0~100數字；quality_score >= 70 且 未有Critical/High程式碼實作風險無緩解方案時才可通過Stage Gate
    # ========= Gate 安全閘門定義（整合VULN-001、VULN-002驗證規則） =========
    gate:
      gate_name: code_implementation_security_gate
      gate_type: security_audit
      description: Code Implementation Stage 安全閘門，檢查原始碼實作安全風險與驗收準則
      validation_rules:
        - criteria_id: AC-CODE-001
          title: 移除程式硬編碼資料庫密碼
          description: >
            原始碼、程式內寫死字串、靜態組態檔不可包含明文資料庫密碼與資料庫憑證；
            憑證需透過環境變數或加密金鑰管理服務載入。.env檔不可提交至Git版本庫，需加入.gitignore。
          related_vuln:
            - VULN-001
          check_method: SAST原始碼掃描 + git歷史secret掃描 + pre-commit hook檢查
          pass_condition: 原始碼與git提交記錄不存在明文DB密碼，憑證由外部金鑰載入
        - criteria_id: AC-CODE-002
          title: 管理員介面強制啟用MFA多因素認證
          description: >
            管理員後台登入流程必須啟用TOTP多因素認證；管理帳號未完成MFA綁定時，禁止登入管理介面。
            僅完成密碼驗證無法存取任何管理功能。
          related_vuln:
            - VULN-002
          check_method: 單元測試、整合測試、端到端登入場景測試
          pass_condition: 未綁定MFA管理帳號登入會被攔截；登入流程必須通過密碼+TOTP二次驗證
      failure_handling:
        action: pause_workflow
        output_artifact_key: acceptance_criteria
        message_template: >
          安全審計發現阻斷型漏洞，自動產生對應驗收準則。
          漏洞清單：{{risk_list}}，請依據validation_rules修正程式後重跑Stage。
    error_handler:
      retry_strategy: 1
      max_retry_count: 3
      fallback_action: mark_human_review
      retry_prompt: "你的輸出JSON不符合schema，請重新產出嚴格符合schema的純JSON，不要任何額外文字、Markdown與註解"
