apiVersion: harness.io/v1
kind: aiSkill
metadata:
  name: 系統邊界
  identifier: skill_se_system_boundary
  description: 系統邊界定義｜C4模型、環境圖與利益相關者映射
  tags:
  - software-engineering
  - se-workflow
spec:
  version: 0.2.0
  skillDefinition:
    meta:
      id: skill_se_system_boundary
      name: 系統邊界
      description: 基於所有前置Artifact，使用C4模型定義系統邊界、繪製環境圖並進行利益相關者映射；輸出系統邊界定義供後續Stage使用
      version: 0.2.0
      depends_on:
      - skill_se_business_model
      output_artifact_type: system_boundary
    input_schema:
      type: object
      properties:
        project_context:
          type: object
        user_input:
          type: string
        previous_artifacts:
          type: array
      required:
      - project_context
    core_prompt: "【Skill ID: skill_se_system_boundary｜職責:系統邊界｜主Skill】\n任務目標:基於所有前置Artifact，使用C4模型定義系統邊界、繪製環境圖並進行利益相關者映射；輸出完整系統邊界定義結構JSON。\n\
      輸入參考:所有前置Artifact、ProjectContext、系統範圍特別假設。\n執行步驟:\n1. 系統擔當分析：根據利益相關者需求與業務目標，釐清系統在整體價值鏈中的角色與責任。\n2. C4環境圖繪製：使用 C4 模型的環境圖層級，展示系統與用戶、其他系統及外部依賴的關係。\n\
      3. 容器層級識別：根據功能紐度與部署單位，劃分系統內容器（應用程式、資料庫、微服務等）。\n4. 組件層輪廓：根據內聚性與耦合度原則，識別主要容器內的組件與其職責。\n5. 利益相關者映射：識別並分類所有利益相關者，分析他們的需求、影響力與參與度。\n\
      6. 介面與協議規格化：定義系統間介面、通訊協議與資料交換格式。\n7. 非功能需求對邊界的影響：考慮效能、安全與法規需求對系統邊界的影響與調整。\n8. 輸出完整系統邊界定義結構JSON.\n## 強制輸出規則\n1. 僅回傳單一純JSON，禁止前言、額外解釋、markdown、```json程式碼標籤、JSON註解。\n\
      2. 嚴格遵守下面Artifact結構，欄名不可修改，不可隨意增減頂層欄位.\n3. quality_score 評分規則（0~100數值，供Gate閘門使用）**必須遵守**：\n   - 0 分：完全空白，無任何有效輸出\n \
      \  - 1~39：少量內容，核心資訊大量缺失，無法進入下一階段\n   - 40~69：內容存在，但關鍵資訊不足，Gate攔截人工審查\n   - 70~84：核心內容完整，少量次要缺點，可放行\n   - 85~100：產物完備，包含風險、邊界、例外場景考量\n\
      \   - 必須在artifact中新增 `score_rationale` 欄位，說明評分理由與扣分項目.\n## 輸出Artifact結構\n{\n  \"context_diagram\": {\"system\":string,\"\
      users\":[string],\"systems\":[string]},\n  \"containers\": [{\"name\":string,\"type\":string,\"technology\":string,\"\
      responsibility\":string}],\n  \"components\": [{\"container\":string,\"name\":string,\"technology\":string,\"responsibility\"\
      :string}],\n  \"stakeholder_mapping\": [{\"stakeholder\":string,\"role\":string,\"influence\":\"High|Medium|Low\",\"\
      needs\":[string]}],\n  \"interface_specs\": [{\"interface\":string,\"protocol\":string,\"data_format\":string}],\n \
      \ \"constraints\": [{\"constraint\":string,\"source\":string,\"impact\":string}],\n  \"quality_score\": number,\n  \"\
      score_rationale\": string\n}\n"
    acceptance_criteria:
    - C4環境圖必須說明系統與外部實體的關係類型與介面
    - 容器識別必須說明功能紐度與部署單位的劃分依據
    - 組件層分解必須說明內聚性與耦合度原則的應用方式
    - 利益相關者映射必須說明識別方法與分類標準
    - 介面與協議規格化必須說明系統間介面、通訊協議與資料交換格式
    - 非功能需求對邊界的影響必須說明效能、安全與法規需求對系統邊界的影響與調整
    - 必須包含 score_rationale 欄位
    - quality_score為0~100數字；quality_score >= 70 且 未有Critical/High系統風險無緩解方案時才可通過Stage Gate
    gate:
      gate_name: system_boundary_quality_gate
      gate_type: quality_threshold_audit
      description: 系統邊界品質閘門，檢查 quality_score 是否達到門檻
      threshold_settings:
        quality_score_min: 70.0
      validation_rules:
      - criteria_id: GATE-SB-001
        title: Quality Score Threshold Check
        description: quality_score must be >= 70.0 to pass the gate.
        check_method: numeric comparison of quality_score against threshold_settings.quality_score_min
        pass_condition: quality_score >= threshold_settings.quality_score_min
      failure_handling:
        action: pause_workflow
        output_artifact_key: quality_score
        message_template: '系統邊界品質閘門未通過：當前 quality_score = {{quality_score}}，門檻為 {{threshold_settings.quality_score_min}}。請檢查系統邊界定義是否完整，重新評估後重跑Stage.

          '
    error_handler:
      retry_strategy: 1
      max_retry_count: 3
      fallback_action: mark_human_review
      retry_prompt: 你的輸出JSON不符合schema，請重新產出嚴格符合schema的純JSON，不要任何額外文字、Markdown與註解
    output_schema:
      type: object
      required:
      - artifact
      - quality_score
      - unresolved_questions
      - risk_list
      properties:
        artifact:
          type: object
          additionalProperties: true
        quality_score:
          type: number
          description: 0~100 的品質分數，Gate閘門判斷依據，必須>=70
        unresolved_questions:
          type: array
          items:
            type: string
        risk_list:
          type: array
          items:
            type: object
            additionalProperties: true
