apiVersion: harness.io/v1
kind: aiSkill
metadata:
  name: 技術設計
  identifier: skill_se_tech_design
  description: 技術解決方案與ADR│架構決策、組件設計與技術棧選型
  tags:
  - software-engineering
  - se-workflow
spec:
  version: 0.2.0
  skillDefinition:
    meta:
      id: skill_se_tech_design
      name: 技術設計
      description: 基於所有前置Artifact，評估技術選項、制定架構決策記錄(ADR)、設計系統組件及選擇適當技術棧；輸出技術設計供後續Stage使用
      version: 0.2.0
      depends_on:
      - skill_se_system_boundary
      output_artifact_type: tech_design
    input_schema:
      type: object
      properties:
        project_context:
          type: object
        user_input:
          type: string
        previous_artifacts:
          type: array
      required:
      - project_context
    core_prompt: "【Skill ID: skill_se_tech_design｜職責:技術設計｜主Skill】\n任務目標:基於所有前置Artifact，評估技術選項、制定架構決策記錄(ADR)、設計系統組件及選擇適當技術棧；輸出完整技術設計結構JSON。\n\
      輸入參考:所有前置Artifact、ProjectContext、技術約束或預先決策。\n執行步驟:\n1. 技術選項評估：根據功能需求與非功能需求，評估候選技術棧與架構風格。\n2. 架構決策記錄(ADR)：使用線性決策記錄格式，記錄重要技術決策的動機、選擇與後果。\n\
      3. 系統組件設計：根據單一職責原則與內聚性，設計系統內容器與組件的介面契約。\n4. 介面契約規格化：定義RESTful API、訊息佇列與事件串流的資料模型與協議。\n5. 資料持久化選型：根據存取模式與一致性需求，選擇適當的資料庫技術與快取策略。\n\
      6. 基礎設施即程式碼(IaC)：選擇適用的基礎設施管理工具與模組化結構。\n7. 技術風險評估：識別新技術採用風險與相容性問題，制定因應方案。\n8. 輸出完整技術設計結構JSON。\n## 強制輸出規則\n1. 僅回傳單一純JSON\n\
      2. 嚴格遵守下面Artifact結構，欄名不可修改，不可隨意增減頂層頂層欄位。\n3. quality_score 評分規則（0~100數值，供Gate閘門使用）**必須遵守**：\n   - 0 分：完全空白，無任何有效輸出\n\
      \   - 1~39：少量內容，核心資訊大量缺失，無法進入下一階段\n   - 40~69：內容存在，但關鍵資訊不足，Gate攔截人工審查\n   - 70~84：核心內容完整，少量次要缺點，可放行\n   - 85~100：產物完備，包含風險、邊界、例外場景考量\n\
      \   - 必須在artifact中新增 `score_rationale` 欄位，說明評分理由與扣分項目.\n## 輸出Artifact結構\n{\n  \"technical_evaluation\": [{\"criteria\"\
      :string,\"options\":[string],\"selected\":string,\"rationale\":string}],\n  \"architecture_decision_records\": [{\"\
      title\":string,\"context\":string,\"decision\":string,\"consequences\":[string]}],\n  \"component_design\": [{\"name\"\
      :string,\"responsibility\":string,\"interfaces\":[string]}],\n  \"technology_stack\": {\"frontend\":string,\"backend\"\
      :string,\"database\":string,\"infrastructure\":string},\n  \"data_persistence\": {\"primary\":string,\"secondary\":[string],\"\
      cache_strategy\":string},\n  \"deployment_architecture\": {\"compute\":string,\"storage\":string,\"network\":string},\n\
      \  \"technical_risks\": [{\"risk\":string,\"probability\":\"low|medium|high\",\"impact\":\"low|medium|high\",\"mitigation\"\
      :string}],\n  \"quality_score\": number,\n  \"score_rationale\": string\n}\n"
    acceptance_criteria:
    - 技術選項評估必須說明評估標準與候選技術棧範圍
    - 架構決策記錄必須說明使用格式與必要元素
    - 系統組件設計必須說明單一職責原則與內聚性的應用方式
    - 介面契約規格化必須說明介面類型與對應的資料模型與協議
    - 資料持久化選型必須說明存取模式與一致性需求的評估方式
    - 基礎設施即程式碼必須說明適用的基礎設施管理工具與模組化結構
    - 技術風險評估必須說明識別風險類型與對應因應方案
    - 必須包含 score_rationale 欄位
    - quality_score為0~100數字；quality_score >= 70 且 未有Critical/High技術風險無緩解方案時才可通過Stage Gate
    gate:
      gate_name: tech_design_quality_gate
      gate_type: quality_audit
      description: Technical Design Stage 品質閘門，檢查技術設計的完整度
      validation_rules:
      - criteria_id: AC-TECH-001
        title: 技術設計品質門檻
        description: 技術設計品質分數必須達到70分以上才能通過閘門
        related_vuln: []
        check_method: 檢查 artefact.quality_score
        pass_condition: artefact.quality_score >= 70.0
      failure_handling:
        action: pause_workflow
        output_artifact_key: score_rationale
        message_template: '技術設計品質分數低於門檻（當前分數：{{quality_score}}），請檢查技術設計是否完整。評分理由：{{score_rationale}}

          '
    error_handler:
      retry_strategy: 1
      max_retry_count: 3
      fallback_action: mark_human_review
      retry_prompt: 你的輸出JSON不符合schema，請重新產出嚴格符合schema的純JSON，不要任何額外文字、Markdown與註見
    output_schema:
      type: object
      required:
      - artifact
      - quality_score
      - unresolved_questions
      - risk_list
      properties:
        artifact:
          type: object
          additionalProperties: true
        quality_score:
          type: number
          description: 0~100 的品質分數，Gate閘門判斷依據，必須>=70
        unresolved_questions:
          type: array
          items:
            type: string
        risk_list:
          type: array
          items:
            type: object
            additionalProperties: true
