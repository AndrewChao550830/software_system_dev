apiVersion: harness.io/v1
kind: aiSkill
metadata:
  name: 技術設計
  identifier: skill_se_tech_design
  description: 技術解決方案與ADR│架構決策、組件設計與技術棧選型
  tags:
    - software-engineering
    - se-workflow
spec:
  version: 0.2.0
  skillDefinition:
    meta:
      id: skill_se_tech_design
      name: 技術設計
      description: 基於所有前置Artifact，評估技術選項、制定架構決策記錄(ADR)、設計系統組件及選擇適當技術棧；輸出技術設計供後續Stage使用
      version: 0.2.0
      depends_on: [skill_se_system_boundary]  # This will be updated based on context in pipeline
      output_artifact_type: tech_design
    input_schema:
      type: object
      properties:
        project_context:
          type: object
          description: Harness全域ProjectContext，包含技術標準與架構決策模板
        user_input:
          type: string
          description: 特別關注的技術約束或預先決策
        previous_artifacts:
          type: array
          description: 所有前置Stage產物，特别是系統邊界定義產物
      required: [project_context]
    core_prompt: |
      【Skill ID: skill_se_tech_design｜職責:技術設計｜主Skill】
      任務目標:基於所有前置Artifact，評估技術選項、制定架構決策記錄(ADR)、設計系統組件及選擇適當技術棧；輸出完整技術設計結構JSON。
      輸入參考:所有前置Artifact、ProjectContext、技術約束或預先決策。
      執行步驟:
      1. 技術選項評估：根據功能需求與非功能需求，評估候選技術棧與架構風格。
      2. 架構決策記錄(ADR)：使用線性決策記錄格式，記錄重要技術決策的動機、選擇與後果。
      3. 系統組件設計：根據單一職責原則與內聚性，設計系統內容器與組件的介面契約。
      4. 介面契約規格化：定義RESTful API、訊息佇列與事件串流的資料模型與協議。
      5. 資料持久化選型：根據存取模式與一致性需求，選擇適當的資料庫技術與快取策略。
      6. 基礎設施即程式碼(IaC)：選擇適用的基礎設施管理工具與模組化結構。
      7. 技術風險評估：識別新技術採用風險與相容性問題，制定因應方案。
      8. 輸出完整技術設計結構JSON。

      ## 強制輸出規則
      1. 僅回傳單一純JSON，禁止前言、額解釋、markdown、```json程式碼標籤、JSON註解。
      2. 嚴格遵守下面Artifact結構，欄名不可修改，不可隨意增減頂層欄位。
      3. quality_score 評分規則（0~100數值，供Gate閘門使用）
         - 80~100:技術評估有明確標準；ADR格式完整可追溯；組件介面有明確契約；技術棧選型有依據說明；無Critical/High風險
         - 70~79:主要技術選項已評估；ADR有主要決策記錄；組件介面有主要契約定義；技術棧選型有主要依據；識別主要技術風險；少量Medium/Low風險；滿足Gate放行門檻
         - 60~69:技術評估存在標準但缺少詳細說明；ADR記錄缺少必要元素；組件介面存在契約但缺少詳細說明；技術棧選型依據不完整；存在High風險但有緩解方案；無Critical阻斷項
         - 0~59:技術評估缺失或標準不足；ADR缺失或格式錯誤；組件介面缺失；技術棧選型缺失；存在Critical/High技術風險無緩解方案；Gate會攔截進入人工審批

      ## 輸出Artifact結構
      {
        "technical_evaluation": [{"criteria":string,"options":[string],"selected":string,"rationale":string}],
        "architecture_decision_records": [{"title":string,"context":string,"decision":string,"consequences":[string]}],
        "component_design": [{"name":string,"responsibility":string,"interfaces":[string]}],
        "technology_stack": {"frontend":string,"backend":string,"database":string,"infrastructure":string},
        "data_persistence": {"primary":string,"secondary":[string],"cache_strategy":string},
        "deployment_architecture": {"compute":string,"storage":string,"network":string},
        "technical_risks": [{"risk":string,"probability":"low|medium|high","impact":"low|medium|high","mitigation":string}],
        "quality_score": number
      }
    output_schema:
      type: object
      required:
        - artifact
        - quality_score
      properties:
        artifact:
          type: object
          properties:
            technical_evaluation:
              type: array
              items:
                type: object
                required: [criteria, options, selected, rationale]
                properties:
                  criteria:
                    type: string
                  options:
                    type: array
                    items:
                      type: string
                  selected:
                    type: string
                  rationale:
                    type: string
            architecture_decision_records:
              type: array
              items:
                type: object
                required: [title, context, decision, consequences]
                properties:
                  title:
                    type: string
                  context:
                    type: string
                  decision:
                    type: string
                  consequences:
                    type: array
                    items:
                      type: string
            component_design:
              type: array
              items:
                type: object
                required: [name, responsibility, interfaces]
                properties:
                  name:
                    type: string
                  responsibility:
                    type: string
                  interfaces:
                    type: array
                    items:
                      type: string
            technology_stack:
              type: object
              properties:
                frontend:
                  type: string
                backend:
                  type: string
                database:
                  type: string
                infrastructure:
                  type: string
            data_persistence:
              type: object
              properties:
                primary:
                  type: string
                secondary:
                  type: array
                  items:
                    type: string
                cache_strategy:
                  type: string
            deployment_architecture:
              type: object
              properties:
                compute:
                  type: string
                storage:
                  type: string
                network:
                  type: string
            technical_risks:
              type: array
              items:
                type: object
                required: [risk, probability, impact, mitigation]
                properties:
                  risk:
                    type: string
                  probability:
                    type: string
                    enum: ["low", "medium", "high"]
                  impact:
                    type: string
                    enum: ["low", "medium", "high"]
                  mitigation:
                    type: string
            quality_score:
              type: number
              minimum: 0
              maximum: 100
    acceptance_criteria:
      - 技術選項評估必須說明評估標準與候選技術棧範圍
      - 架構決策記錄必須說明使用格式與必要元素
      - 系統組件設計必須說明單一職責原則與內聚性的應用方式
      - 介面契約規格化必須說明介面類型與對應的資料模型與協議
      - 資料持久化選型必須說明存取模式與一致性需求的評估方式
      - 基礎設施即程式碼必須說明適用的基礎設施管理工具與模組化結構
      - 技術風險評估必須說明識別風險類型與對應因應方案
      - quality_score為0~100數字；quality_score >= 70 且 未有Critical/High技術風險無緩解方案時才可通過Stage Gate
    error_handler:
      retry_strategy: 1
      max_retry_count: 3
      fallback_action: mark_human_review
      retry_prompt: "你的輸出JSON不符合schema，請重新產出嚴格符合schema的純JSON，不要任何額外文字、Markdown與註解"