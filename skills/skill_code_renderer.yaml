apiVersion: harness.io/v1
kind: aiSkill
metadata:
  name: 程式碼轉譯
  identifier: skill_code_renderer
  description: 將程式碼實作JSON元資料轉譯為真實可執行程式碼及相關檔案
  tags:
  - software-engineering
  - se-workflow
  - code-generation
spec:
  version: 0.2.0
  skillDefinition:
    meta:
      id: skill_code_renderer
      name: 程式碼轉譯
      description: 基於skill_se_code_implementation的JSON元資料，生成實際的程式碼檔案(.py、.sql、測試腳本、設定檔等)，遵守configuration_management規範並實作上游acceptance_criteria
      version: 0.2.0
      depends_on:
      - skill_se_code_implementation
      output_artifact_type: code_rendered
    input_schema:
      type: object
      properties:
        project_context:
          type: object
        user_input:
          type: string
        previous_artifacts:
          type: array
      required:
      - project_context
      - previous_artifacts
    core_prompt: "【Skill ID: skill_code_renderer｜職責:程式碼轉譯｜主Skill】\n任務目標:將skill_se_code_implementation產出的程式碼實作結構JSON轉譯為真實可執行的程式碼檔案，包括原始程式碼、資料庫腳本、測試檔案、設定檔等。\n\
      輸入參考:skill_se_code_implementation的產出JSON、ProjectContext、實作技術或框架假設。\n執行步驟:\n1. 解析輸入JSON：讀取並驗證skill_se_code_implementation的完整程式碼實作結構JSON\n\
      2. 專案結構創建：根據project_structure中的directories和files創建相應的目錄和檔案結構\n3. 原始程式碼生成：根據api_endpoints、data_models、business_logic生成對應的程式碼檔案\n\
      4. 資料庫腳本生成：根據database_migration生成可執行的SQL遷移腳本\n5. 測試樣板生成：根據testing_framework生成基本的單元測試檔案\n6. 設定檔生成：根據configuration_management生成環境配置檔案範本\n\
      7. 錯誤處理與日誌實作：根據error_handling策略在程式碼中實作統一錯誤處理與日誌\n8. 安全合規檢查：確保產出的程式碼不含硬編碼敏感資訊（密碼、金鑰等），符合configuration_management規範\n\
      9. 驗收標準實作：根據接受標準(acceptance_criteria)在程式碼中實作對應的驗證邏輯或說明\n10. 輸出渲染结果：產出已渲渲的程式碼檔案清單和品質分數\n## 強制輸出規則\n1. 僅回傳單一純JSON，禁止前言、額外解釋、markdown、```json程式碼標籤、JSON註解。\n\
      2. 嚴守下面Artifact結構，欄名不可修改，不可隨意增減頂層欄位.\n3. quality_score 評分規則（0~100數值，供Gate閘門使用）**必須遵守**：\n   - 0 分：完全空白，無任何渲染程式碼\n  \
      \ - 1~39：有少量程式碼，渲染輸出大量缺失，無法交付\n   - 40~69：程式碼可渲染，但有缺失/格式問題，Gate攔截人工審查\n   - 70~84：程式碼渲染完整，少量次要瑕疵，可放行\n   - 85~100：渲染產物完整、結構清晰、符合全部需求與規範\n\
      \   - 必須在artifact中新增 `score_rationale` 欄位，說明評分理由與扣分項目，同時帶入my-code-standard前置檢查摘要.\n## 輸出Artifact結構\n{\n  \"rendered_files\"\
      :\n    type: array\n    items:\n      type: object\n      required: [file_path, file_type, language, content, size_bytes]\n\
      \      properties:\n        file_path:\n          type: string\n          description: 檔案的相對路徑（從專案根目錄開始）\n        file_type:\n\
      \          type: string\n          description: 檔案類型，如python_source, sql_script, test_file, config_file等\n        language:\n\
      \          type: string\n          description: 程式語言，如python, sql, yaml, json等\n        content:\n          type: string\n\
      \          description: 檔案的實際內容\n        size_bytes:\n          type: integer\n          description: 檔案大小（位元組）\n  \"\
      project_structure\":\n    type: object\n    properties:\n      directories:\n        type: array\n        items:\n \
      \         type: string\n      files:\n        type: array\n        items:\n          type: string\n  \"technology_stack\"\
      :\n    type: object\n    properties:\n      language:\n        type: string\n      framework:\n        type: string\n\
      \      version:\n        type: string\n  \"rendering_summary\":\n    type: object\n    properties:\n      total_files:\n\
      \        type: integer\n      total_lines:\n        type: integer\n      languages_used:\n        type: array\n    \
      \    items:\n          type: string\n      frameworks_used:\n        type: array\n        items:\n          type: string\n\
      \  \"risk_list\":\n    type: array\n    items:\n      type: object\n      required: [vuln_id, severity, description]\n\
      \      properties:\n        vuln_id:\n          type: string\n        severity:\n          type: string\n        description:\n\
      \          type: string\n  \"acceptance_criteria\":\n    type: array\n    items:\n      type: object\n      required:\n\
      \        [\n          criteria_id,\n          title,\n          description,\n          related_vuln,\n          check_method,\n\
      \          pass_condition,\n        ]\n      properties:\n        criteria_id:\n          type: string\n        title:\n\
      \          type: string\n        description:\n          type: string\n        related_vuln:\n          type: array\n\
      \          items:\n            type: string\n        check_method:\n          type: string\n        pass_condition:\n\
      \          type: string\n  \"score_rationale\":\n    type: string\n}\n"
    required:
    - rendered_files
    - project_structure
    - technology_stack
    - rendering_summary
    - risk_list
    - acceptance_criteria
    - score_rationale
    quality_score:
      type: number
      minimum: 0
      maximum: 100
      description: 程式碼轉譯完整度分數，Gate閘門判斷依據
    acceptance_criteria:
    - 必須說明所使用的程式語言與框架版本
    - 必須說明遵循的編碼標準與命名慣例
    - 必須驗證生成的程式碼不含硬編碼的敏感資訊
    - 必須確認生成的檔案路徑與專案結構匹配
    - 必須說明是否已實作所有接受標準中的可程式化項目
    - 必須包含 score_rationale 欄位
    - quality_score為0~100數字；quality_score >= 70 且 未有Critical/High安全風險時才可通過Stage Gate
    gate:
      gate_name: code_renderer_quality_gate
      threshold_settings:
        quality_score_min: 70.0
      validation_rules:
      - quality_score >= 70.0
      failure_handling:
        action: pause_workflow
    error_handler:
      retry_strategy: 1
      max_retry_count: 3
      fallback_action: mark_human_review
      retry_prompt: 你的輸出JSON不符合schema，請重新產出嚴格符合schema的純JSON，不要任何額外文字、Markdown與註解
    output_schema:
      type: object
      required:
      - artifact
      - quality_score
      - unresolved_questions
      - risk_list
      properties:
        artifact:
          type: object
          additionalProperties: true
        quality_score:
          type: number
          description: 0~100 的品質分數，Gate閘門判斷依據，必須>=70
        unresolved_questions:
          type: array
          items:
            type: string
        risk_list:
          type: array
          items:
            type: object
            additionalProperties: true
